# Netlify configuration for Kart Racer frontend
# Publish root to allow access to both /client and /shared

[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/client/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Redirect root to the game
[[redirects]]
  from = "/"
  to = "/client/index.html"
  status = 200

# Block server directory from being served
[[redirects]]
  from = "/server/*"
  to = "/client/index.html"
  status = 404
