# Netlify configuration for Kart Racer frontend
# Build copies shared modules into client, then serves client/

[build]
  publish = "client"
  command = "mkdir -p client/shared && cp shared/*.js client/shared/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
